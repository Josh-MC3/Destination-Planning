<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trip Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ── RESET & VARIABLES ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#C9A84C;--gold-light:#E8C96B;--gold-dim:#8B6914;
  --black:#0A0A0A;--surface:#111111;--surface2:#1A1A1A;--surface3:#242424;
  --border:#2A2A2A;--border-light:#333;
  --text:#F0EDE8;--text-dim:#8A8A8A;--text-muted:#555;
  --accent-blue:#4A90D9;--accent-green:#4CAF50;--accent-red:#E57373;
  --font-display:'Cormorant Garamond',serif;
  --font-body:'DM Sans',sans-serif;
  --radius:8px;--radius-sm:4px;
  --shadow:0 4px 24px rgba(0,0,0,.6);
  --shadow-gold:0 0 20px rgba(201,168,76,.15);
  --transition:.2s ease;
}
/* ── LIGHT MODE OVERRIDES ── */
html[data-theme="light"]{
  --black:#F5F3EF;--surface:#FFFFFF;--surface2:#F0EDE8;--surface3:#E8E4DD;
  --border:#D8D3CC;--border-light:#C8C2B8;
  --text:#1A1714;--text-dim:#5A5450;--text-muted:#9A948E;
  --shadow:0 4px 24px rgba(0,0,0,.12);
  --shadow-gold:0 0 20px rgba(201,168,76,.2);
}
html[data-theme="light"] body{background:var(--black)}
html[data-theme="light"] #app-header{background:rgba(245,243,239,.96)}
html[data-theme="light"] input,
html[data-theme="light"] select,
html[data-theme="light"] textarea{background:var(--surface);color:var(--text);border-color:var(--border-light)}
html[data-theme="light"] select option{background:var(--surface)}
html[data-theme="light"] #loading{background:var(--black)}
html[data-theme="light"] .modal{background:var(--surface)}
html[data-theme="light"] #toast{background:var(--surface2);color:var(--text)}
html[data-theme="light"] ::-webkit-scrollbar-track{background:var(--surface2)}
html[data-theme="light"] ::-webkit-scrollbar-thumb{background:var(--border-light)}

/* ── THEME TOGGLE BUTTON ── */
#btn-theme{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--border-light);
  background:var(--surface3);color:var(--text-dim);font-size:1rem;
  display:flex;align-items:center;justify-content:center;
  transition:all var(--transition);flex-shrink:0;
}
#btn-theme:hover{border-color:var(--gold);color:var(--gold);background:var(--surface2)}

html{scroll-behavior:smooth}
body{font-family:var(--font-body);background:var(--black);color:var(--text);min-height:100vh;overflow-x:hidden}
a{color:var(--gold);text-decoration:none}
button{cursor:pointer;font-family:var(--font-body)}
input,select,textarea{font-family:var(--font-body);color:var(--text);background:var(--surface2);border:1px solid var(--border-light);border-radius:var(--radius-sm);padding:8px 12px;outline:none;transition:border-color var(--transition)}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
input::placeholder{color:var(--text-muted)}
select option{background:var(--surface2)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--gold-dim)}

/* ── HEADER ── */
#app-header{
  position:sticky;top:0;z-index:100;
  background:rgba(10,10,10,.95);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:0 24px;display:flex;align-items:center;justify-content:space-between;
  height:60px;
}
.header-logo{font-family:var(--font-display);font-size:1.5rem;font-weight:300;letter-spacing:.08em;color:var(--gold)}
.header-logo span{color:var(--text-dim);font-style:italic;font-size:.9rem;margin-left:8px}
.header-actions{display:flex;gap:8px;align-items:center}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);border:none;font-size:.8rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase;transition:all var(--transition)}
.btn-gold{background:var(--gold);color:var(--black)}
.btn-gold:hover{background:var(--gold-light);transform:translateY(-1px);box-shadow:var(--shadow-gold)}
.btn-outline{background:transparent;color:var(--text-dim);border:1px solid var(--border-light)}
.btn-outline:hover{border-color:var(--gold);color:var(--gold)}
.btn-ghost{background:transparent;color:var(--text-dim);border:none;padding:6px 10px}
.btn-ghost:hover{color:var(--text)}
.btn-danger{background:transparent;color:var(--accent-red);border:1px solid var(--accent-red)}
.btn-danger:hover{background:var(--accent-red);color:#fff}
.btn-sm{padding:5px 10px;font-size:.75rem}
.btn-icon{width:32px;height:32px;padding:0;justify-content:center;border-radius:50%;background:var(--surface3);border:1px solid var(--border);color:var(--text-dim)}
.btn-icon:hover{border-color:var(--gold);color:var(--gold)}

/* ── NAV TABS ── */
#nav-bar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 24px;display:flex;align-items:center;gap:0;flex-wrap:wrap;
}
.nav-tab{
  padding:14px 20px;font-size:.8rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-muted);border:none;background:none;white-space:nowrap;
  border-bottom:2px solid transparent;transition:all var(--transition);position:relative;
}
.nav-tab:hover{color:var(--text-dim)}
.nav-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.nav-tab .tab-count{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--surface3);color:var(--text-dim);
  width:18px;height:18px;border-radius:9px;font-size:.65rem;margin-left:6px;
}
.nav-tab.active .tab-count{background:var(--gold-dim);color:var(--gold-light)}

/* ── MAIN LAYOUT ── */
#main-layout{display:flex;height:calc(100vh - 60px - var(--nav-height, 44px));overflow:hidden;position:relative}

/* ── POOL REOPEN TAB ── */
#pool-reopen-tab{
  display:none;
  position:absolute;left:0;top:50%;transform:translateY(-50%);
  z-index:10;
  width:20px;height:64px;
  background:var(--surface2);border:1px solid var(--border-light);
  border-left:none;border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  align-items:center;justify-content:center;
  color:var(--gold);font-size:.7rem;cursor:pointer;
  transition:all var(--transition);writing-mode:vertical-lr;
  letter-spacing:.06em;font-family:var(--font-body);font-size:.6rem;
  text-transform:uppercase;padding:8px 3px;
}
#pool-reopen-tab:hover{background:var(--surface3);border-color:var(--gold);width:24px}
#pool-reopen-tab.visible{display:flex}
#trip-pool{
  width:280px;min-width:260px;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;transition:width .3s ease;
}
#trip-pool.collapsed{width:0;min-width:0;overflow:hidden}
.pool-header{
  padding:16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.pool-title{font-family:var(--font-display);font-size:1.1rem;font-weight:400;color:var(--gold)}
.pool-meta{font-size:.72rem;color:var(--text-dim);margin-top:2px}
.pool-body{flex:1;overflow-y:auto;padding:12px}
.pool-empty{
  text-align:center;padding:40px 16px;
  color:var(--text-muted);font-size:.8rem;line-height:1.8;
}
.pool-empty .icon{font-size:2rem;margin-bottom:8px;display:block;opacity:.3}
.pool-footer{padding:12px;border-top:1px solid var(--border);flex-shrink:0}
.pool-cost{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;margin-bottom:4px}
.pool-cost .label{color:var(--text-dim)}
.pool-cost .value{color:var(--gold);font-weight:500}
.headcount-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.headcount-row label{font-size:.75rem;color:var(--text-dim);white-space:nowrap}
.headcount-row input{width:60px;text-align:center;font-size:.85rem}

/* ── POOL CARD ── */
.pool-card{
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px 12px;margin-bottom:8px;cursor:grab;transition:all var(--transition);
  position:relative;
}
.pool-card:hover{border-color:var(--gold-dim);box-shadow:var(--shadow-gold)}
.pool-card.dragging{opacity:.5;cursor:grabbing;transform:rotate(2deg)}
.pool-card-name{font-size:.82rem;font-weight:500;color:var(--text);line-height:1.3;margin-bottom:4px;padding-right:20px}
.pool-card-meta{display:flex;gap:8px;flex-wrap:wrap}
.pool-card-badge{font-size:.68rem;padding:2px 6px;border-radius:10px;background:var(--surface3);color:var(--text-dim)}
.pool-card-badge.price{color:var(--gold-light)}
.pool-card-remove{
  position:absolute;top:8px;right:8px;
  width:18px;height:18px;border-radius:50%;
  background:none;border:none;color:var(--text-muted);font-size:.7rem;
  display:flex;align-items:center;justify-content:center;
  transition:all var(--transition);
}
.pool-card-remove:hover{background:var(--accent-red);color:#fff}

/* ── CENTER PANEL ── */
#center-panel{flex:1;overflow:hidden;display:flex;flex-direction:column}

/* ── VIEW TABS ── */
#view-tabs{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;
}
.view-switcher{display:flex;gap:4px;background:var(--surface2);border-radius:var(--radius-sm);padding:3px}
.view-btn{padding:5px 14px;border:none;border-radius:4px;font-size:.75rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);background:none;transition:all var(--transition)}
.view-btn.active{background:var(--surface3);color:var(--text);border:1px solid var(--border-light)}
.view-actions{display:flex;gap:6px;align-items:center}

/* ── ACTIVITY BROWSER ── */
#activity-view{flex:1;display:flex;flex-direction:column;overflow:hidden}
.filter-bar{
  padding:12px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;
}
.filter-bar input[type=text]{flex:1;min-width:160px;font-size:.8rem}
.filter-bar select{font-size:.78rem;min-width:120px}
.filter-count{font-size:.75rem;color:var(--text-dim);white-space:nowrap;margin-left:auto}

.activity-grid{
  flex:1;overflow-y:auto;padding:16px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;
  align-content:start;
}
.activity-card{
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;transition:all var(--transition);display:flex;flex-direction:column;
  min-height:200px;
}
.activity-card:hover{border-color:var(--border-light);transform:translateY(-2px);box-shadow:var(--shadow)}
.activity-card.added{border-color:var(--gold-dim);opacity:.7}
.card-header{padding:16px 16px 0}
.card-category{
  display:inline-block;font-size:.7rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;
  padding:4px 10px;border-radius:10px;margin-bottom:10px;
}
.cat-Adventure{background:rgba(74,144,217,.15);color:#6AABEF}
.cat-Cultural{background:rgba(201,168,76,.12);color:var(--gold-light)}
.cat-Nature{background:rgba(76,175,80,.15);color:#80C784}
.cat-Nightlife{background:rgba(156,39,176,.15);color:#CE93D8}
.cat-Food{background:rgba(255,152,0,.15);color:#FFB74D}
.cat-Water{background:rgba(0,188,212,.15);color:#4DD0E1}
.cat-Wellness{background:rgba(233,30,99,.15);color:#F48FB1}
.cat-Shopping{background:rgba(158,158,158,.15);color:#BDBDBD}
.cat-Sightseeing{background:rgba(121,85,72,.15);color:#BCAAA4}

.card-name{font-size:1rem;font-weight:500;color:var(--text);line-height:1.4;margin-bottom:6px}
.card-location{font-size:.8rem;color:var(--text-dim);margin-bottom:10px;display:flex;align-items:center;gap:4px}
.card-desc{padding:0 16px;font-size:.8rem;color:var(--text-dim);line-height:1.6;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-footer{
  padding:12px 16px;margin-top:10px;border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.card-meta{display:flex;gap:10px;flex-wrap:wrap}
.card-meta span{font-size:.8rem;color:var(--text-dim);display:flex;align-items:center;gap:3px}
.card-meta .price{color:var(--gold-light);font-weight:500}
.card-add-btn{
  padding:7px 14px;font-size:.78rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase;
  background:var(--surface3);border:1px solid var(--border-light);border-radius:var(--radius-sm);
  color:var(--text-dim);transition:all var(--transition);white-space:nowrap;flex-shrink:0;
}
.card-add-btn:hover{background:var(--gold);border-color:var(--gold);color:var(--black)}
.card-add-btn.added{background:var(--gold-dim);border-color:var(--gold-dim);color:var(--gold-light)}
.activity-card.multi-day .card-name::after{content:" ★";color:var(--gold-dim);font-size:.7rem}

/* ── ITINERARY VIEW ── */
#itinerary-view{flex:1;overflow:hidden;display:flex;flex-direction:column}
.itinerary-toolbar{
  padding:10px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;
}
.day-controls{display:flex;align-items:center;gap:6px}
.day-controls label{font-size:.75rem;color:var(--text-dim)}
.day-controls input{width:50px;text-align:center}
.hour-toggle{display:flex;align-items:center;gap:6px;margin-left:8px}
.hour-toggle label{font-size:.75rem;color:var(--text-dim)}
.toggle-switch{position:relative;width:36px;height:20px}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{
  position:absolute;inset:0;background:var(--surface3);border-radius:10px;cursor:pointer;
  border:1px solid var(--border-light);transition:all var(--transition);
}
.toggle-slider::before{
  content:'';position:absolute;width:14px;height:14px;background:var(--text-muted);
  border-radius:50%;top:2px;left:2px;transition:all var(--transition);
}
.toggle-switch input:checked+.toggle-slider{background:var(--gold-dim);border-color:var(--gold)}
.toggle-switch input:checked+.toggle-slider::before{transform:translateX(16px);background:var(--gold-light)}

.itinerary-canvas{flex:1;overflow-x:auto;overflow-y:hidden;display:flex;gap:0;padding:0}
.day-column{
  min-width:220px;flex:1;border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.day-column:last-child{border-right:none}
.day-header{
  padding:10px 12px;background:var(--surface2);border-bottom:1px solid var(--border);
  font-size:.78rem;font-weight:500;text-transform:uppercase;letter-spacing:.06em;
  color:var(--text-dim);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.day-header span{color:var(--gold);font-family:var(--font-display);font-size:1rem;font-weight:400;text-transform:none;letter-spacing:0}
.day-body{flex:1;overflow-y:auto;padding:8px;min-height:200px}
.day-body.drag-over{background:rgba(201,168,76,.06);outline:2px dashed var(--gold-dim);outline-offset:-2px;border-radius:var(--radius)}
.hour-slots{display:flex;flex-direction:column}
.hour-slot{
  display:flex;gap:6px;min-height:50px;padding:2px 0;
  border-bottom:1px solid rgba(255,255,255,.04);
}
.hour-label{width:38px;font-size:.6rem;color:var(--text-muted);padding-top:4px;flex-shrink:0;text-align:right}
.hour-slot-body{flex:1;min-height:44px;border-radius:4px;transition:background var(--transition);padding:2px}
.hour-slot-body.drag-over{background:rgba(201,168,76,.08);outline:1px dashed var(--gold-dim)}
.day-drop-zone{
  min-height:80px;border:2px dashed var(--border);border-radius:var(--radius);
  display:flex;align-items:center;justify-content:center;color:var(--text-muted);
  font-size:.75rem;transition:all var(--transition);margin-bottom:4px;
}
.day-drop-zone.drag-over{border-color:var(--gold-dim);background:rgba(201,168,76,.05);color:var(--gold-dim)}

/* ── ITINERARY ITEM ── */
.itinerary-item{
  background:var(--surface3);border:1px solid var(--border-light);border-radius:var(--radius-sm);
  padding:8px 10px;margin-bottom:6px;cursor:grab;transition:all var(--transition);
  position:relative;border-left:3px solid var(--gold-dim);
}
.itinerary-item:hover{border-left-color:var(--gold);box-shadow:var(--shadow-gold)}
.itinerary-item.dragging{opacity:.4;cursor:grabbing}
.itinerary-item-name{font-size:.78rem;font-weight:500;color:var(--text);line-height:1.3;padding-right:20px}
.itinerary-item-meta{font-size:.68rem;color:var(--text-dim);margin-top:3px;display:flex;gap:6px}
.itinerary-item-remove{
  position:absolute;top:6px;right:6px;width:16px;height:16px;
  background:none;border:none;color:var(--text-muted);font-size:.6rem;border-radius:50%;
  display:flex;align-items:center;justify-content:center;transition:all var(--transition);
}
.itinerary-item-remove:hover{background:var(--accent-red);color:#fff}
.custom-item{border-left-color:var(--accent-blue)}

/* ── MODALS ── */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);
  z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;
  opacity:0;pointer-events:none;transition:opacity var(--transition);
}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{
  background:var(--surface);border:1px solid var(--border-light);border-radius:var(--radius);
  padding:24px;max-width:480px;width:100%;box-shadow:var(--shadow);
  transform:translateY(16px);transition:transform var(--transition);
}
.modal-overlay.open .modal{transform:translateY(0)}
.modal h2{font-family:var(--font-display);font-size:1.4rem;font-weight:400;color:var(--gold);margin-bottom:16px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:.75rem;color:var(--text-dim);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.form-group input,.form-group select,.form-group textarea{width:100%;font-size:.85rem}
.form-group textarea{resize:vertical;min-height:70px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}

/* ── TOAST ── */
#toast{
  position:fixed;bottom:24px;right:24px;z-index:300;
  background:var(--surface2);border:1px solid var(--border-light);border-radius:var(--radius);
  padding:10px 16px;font-size:.8rem;color:var(--text);box-shadow:var(--shadow);
  transform:translateY(80px);opacity:0;transition:all .3s ease;pointer-events:none;
  display:flex;align-items:center;gap:8px;
}
#toast.show{transform:translateY(0);opacity:1}
#toast.success{border-color:var(--gold-dim)}
#toast.success::before{content:'✓';color:var(--gold)}

/* ── LOADING ── */
#loading{
  position:fixed;inset:0;background:var(--black);z-index:400;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  transition:opacity .5s ease;
}
#loading.done{opacity:0;pointer-events:none}
.loading-logo{font-family:var(--font-display);font-size:2.5rem;font-weight:300;color:var(--gold);letter-spacing:.1em}
.loading-bar{width:200px;height:2px;background:var(--surface3);border-radius:1px;overflow:hidden}
.loading-fill{height:100%;background:var(--gold);width:0%;transition:width .3s ease;border-radius:1px}
.loading-text{font-size:.75rem;color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase}

/* ── EMPTY STATE ── */
.empty-state{
  grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-muted);
}
.empty-state .icon{font-size:3rem;margin-bottom:12px;opacity:.25}
.empty-state p{font-size:.85rem;line-height:1.8}

/* ── EXPORT VIEW ── */
#export-view{flex:1;overflow-y:auto;padding:24px;display:none}
#export-view.active{display:block}
.export-section{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.export-section h3{font-family:var(--font-display);color:var(--gold);margin-bottom:12px;font-weight:400}
.export-day{margin-bottom:16px}
.export-day h4{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.export-item{display:flex;justify-content:space-between;padding:6px 0;font-size:.82rem;border-bottom:1px solid rgba(255,255,255,.04)}
.export-total{display:flex;justify-content:space-between;padding:12px 0;font-size:.9rem;font-weight:500;border-top:2px solid var(--gold-dim);margin-top:8px}

/* ── MOBILE ── */
#pool-toggle-mobile{display:none}
@media(max-width:900px){
  #main-layout{flex-direction:column;height:auto;overflow:auto}
  #trip-pool{width:100%;min-width:0;max-height:280px;border-right:none;border-bottom:1px solid var(--border)}
  #trip-pool.collapsed{max-height:0;overflow:hidden}
  #pool-reopen-tab{display:none!important}
  #center-panel{min-height:60vh}
  .activity-grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  #pool-toggle-mobile{display:flex}
  .itinerary-canvas{overflow-x:auto}
  .day-column{min-width:200px}
  .filter-bar{gap:6px}
  .filter-bar select{min-width:100px}
}
@media(max-width:600px){
  #app-header{padding:0 14px}
  .header-logo span{display:none}
  #nav-bar{padding:0 10px}
  .nav-tab{padding:12px 12px}
  .activity-grid{grid-template-columns:1fr;padding:10px}
  .form-row{grid-template-columns:1fr}
  #main-layout{height:auto}
  #trip-pool{max-height:220px}
}

/* ── PRINT ── */
@media print{
  #app-header,#nav-bar,#view-tabs,#trip-pool,#loading,#toast,#modal-custom,#modal-save{display:none!important}
  #center-panel{overflow:visible}
  #export-view{display:block!important;overflow:visible}
  body{background:#fff;color:#000}
  .export-section{border:1px solid #ccc;background:#fff}
  .export-section h3{color:#8B6914}
}

/* ── REGION PILLS ── */
.region-filter-bar{
  display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;
  background:var(--surface2);border-bottom:1px solid var(--border);flex-shrink:0;
}
.region-pill{
  padding:4px 12px;border-radius:12px;font-size:.7rem;font-weight:500;letter-spacing:.04em;
  background:var(--surface3);border:1px solid var(--border);color:var(--text-dim);
  transition:all var(--transition);
}
.region-pill.active{background:rgba(201,168,76,.12);border-color:var(--gold-dim);color:var(--gold-light)}
.region-pill:hover{border-color:var(--border-light);color:var(--text)}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading">
  <div class="loading-logo">TRIP BUILDER</div>
  <div class="loading-bar"><div class="loading-fill" id="loading-fill"></div></div>
  <div class="loading-text" id="loading-text">Loading destinations…</div>
</div>

<!-- HEADER -->
<header id="app-header">
  <div class="header-logo">
    Trip Builder
  </div>
  <div class="header-actions">
    <button id="btn-theme" title="Toggle light/dark mode">🌙</button>
    <button class="btn btn-outline btn-sm" id="btn-save">💾 Save</button>
    <button class="btn btn-outline btn-sm" id="btn-load">📂 Load</button>
    <button class="btn btn-outline btn-sm" id="btn-export">📋 Export</button>
    <button class="btn btn-gold btn-sm" id="btn-custom-event">+ Custom Event</button>
    <button class="btn btn-ghost btn-sm" id="pool-toggle-mobile" style="display:none">🗂 Pool</button>
  </div>
</header>

<!-- COUNTRY NAV -->
<nav id="nav-bar"></nav>

<!-- MAIN -->
<div id="main-layout">

  <!-- TRIP POOL REOPEN TAB -->
  <button id="pool-reopen-tab" title="Open Trip Pool">Pool</button>

  <!-- TRIP POOL -->
  <aside id="trip-pool">
    <div class="pool-header">
      <div>
        <div class="pool-title">Trip Pool</div>
        <div class="pool-meta" id="pool-meta">0 activities selected</div>
      </div>
      <button class="btn-icon" id="pool-collapse-btn" title="Collapse">‹</button>
    </div>
    <div class="pool-body" id="pool-body">
      <div class="pool-empty" id="pool-empty">
        <span class="icon">🗺️</span>
        Browse activities and tap<br><strong style="color:var(--text-dim)">Add to Trip</strong><br>to start planning
      </div>
    </div>
    <div class="pool-footer">
      <div class="pool-cost">
        <span class="label">Total Cost</span>
        <span class="value" id="pool-total">$0</span>
      </div>
      <div class="pool-cost">
        <span class="label">Per Person</span>
        <span class="value" id="pool-per-person">$0</span>
      </div>
      <div class="headcount-row">
        <label for="headcount">Guests:</label>
        <input type="number" id="headcount" value="10" min="1" max="100">
        <button class="btn btn-ghost btn-sm" id="pool-clear-btn" style="margin-left:auto;color:var(--text-muted);font-size:.7rem">Clear all</button>
      </div>
    </div>
  </aside>

  <!-- CENTER -->
  <div id="center-panel">
    <!-- VIEW SWITCHER -->
    <div id="view-tabs">
      <div class="view-switcher">
        <button class="view-btn active" data-view="activities">Browse</button>
        <button class="view-btn" data-view="itinerary">Itinerary</button>
        <button class="view-btn" data-view="export">Summary</button>
      </div>
      <div class="view-actions">
        <span id="country-label" style="font-size:.75rem;color:var(--text-dim)"></span>
      </div>
    </div>

    <!-- ACTIVITIES VIEW -->
    <div id="activity-view">
      <div class="filter-bar">
        <input type="text" id="search-input" placeholder="Search activities…" style="max-width:220px">
        <select id="filter-category">
          <option value="">All Categories</option>
          <option>Adventure</option><option>Cultural</option><option>Food & Dining</option>
          <option>Nature</option><option>Nightlife</option><option>Sightseeing</option>
          <option>Shopping</option><option>Water Sports</option><option>Wellness</option>
        </select>
        <select id="filter-price">
          <option value="">Any Price</option>
          <option value="0-25">Under $25</option>
          <option value="25-75">$25–$75</option>
          <option value="75-200">$75–$200</option>
          <option value="200+">$200+</option>
          <option value="free">Free</option>
        </select>
        <span class="filter-count" id="filter-count"></span>
      </div>
      <div class="region-filter-bar" id="region-pills"></div>
      <div class="activity-grid" id="activity-grid"></div>
    </div>

    <!-- ITINERARY VIEW -->
    <div id="itinerary-view" style="display:none">
      <div class="itinerary-toolbar">
        <div class="day-controls">
          <label>Days:</label>
          <button class="btn-icon btn-sm" id="day-minus">−</button>
          <input type="number" id="day-count" value="5" min="1" max="14" style="width:48px;text-align:center">
          <button class="btn-icon btn-sm" id="day-plus">+</button>
        </div>
        <div class="hour-toggle">
          <label for="hour-mode-toggle">Hour detail</label>
          <label class="toggle-switch">
            <input type="checkbox" id="hour-mode-toggle">
            <span class="toggle-slider"></span>
          </label>
        </div>
        <button class="btn btn-outline btn-sm" id="btn-clear-itinerary" style="margin-left:auto">Clear Itinerary</button>
      </div>
      <div class="itinerary-canvas" id="itinerary-canvas"></div>
    </div>

    <!-- EXPORT VIEW -->
    <div id="export-view">
      <div id="export-content"></div>
    </div>
  </div>
</div>

<!-- CUSTOM EVENT MODAL -->
<div class="modal-overlay" id="modal-custom">
  <div class="modal">
    <h2>Custom Event</h2>
    <div class="form-group">
      <label>Event Name *</label>
      <input type="text" id="custom-name" placeholder="e.g. Private Yacht Charter">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Location</label>
        <input type="text" id="custom-location" placeholder="City, Country">
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="custom-category">
          <option>Adventure</option><option>Cultural</option><option>Food & Dining</option>
          <option>Nature</option><option selected>Nightlife</option><option>Sightseeing</option>
          <option>Shopping</option><option>Water Sports</option><option>Wellness</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Price (USD)</label>
        <input type="number" id="custom-price" placeholder="0" min="0">
      </div>
      <div class="form-group">
        <label>Duration (hours)</label>
        <input type="number" id="custom-duration" placeholder="2" min="0.5" step="0.5">
      </div>
    </div>
    <div class="form-group">
      <label>Notes</label>
      <textarea id="custom-notes" placeholder="Any details about this event…"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="custom-cancel">Cancel</button>
      <button class="btn btn-gold" id="custom-save">Add to Pool</button>
    </div>
  </div>
</div>

<!-- SAVE MODAL -->
<div class="modal-overlay" id="modal-save">
  <div class="modal">
    <h2>Save Trip</h2>
    <div class="form-group">
      <label>Trip Name</label>
      <input type="text" id="save-name" placeholder="e.g. Jake's Bachelor Party - Thailand 2026">
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="save-cancel">Cancel</button>
      <button class="btn btn-gold" id="save-confirm">Save</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
const STATE = {
  countries: {},         // loaded country data keyed by slug
  countryIndex: [],      // parsed index.json countries array — single source of truth
  currentCountry: null,
  pool: [],              // {id, name, location, price_usd, duration, category, multi_day, custom}
  itinerary: {},         // {day: [{...item, hour?}]}
  dayCount: 5,
  hourMode: false,
  headcount: 10,
  filterCategory: '',
  filterPrice: '',
  filterRegion: '',
  searchQuery: '',
  currentView: 'activities',
  poolCollapsed: false,
};

// ═══════════════════════════════════════════════════════
// LOAD DATA
// ═══════════════════════════════════════════════════════
async function loadCountries() {
  const fill = document.getElementById('loading-fill');
  const txt  = document.getElementById('loading-text');

  // ── Phase 1: fetch index.json ──────────────────────────
  txt.textContent = 'Loading index…';
  let indexData;
  try {
    const r = await fetch('index.json');
    if (!r.ok) throw new Error(`index.json returned ${r.status}`);
    indexData = await r.json();
  } catch(e) {
    txt.textContent = 'Error: could not load index.json';
    fill.style.width = '100%';
    fill.style.background = '#E57373';
    console.error('loadCountries: failed to fetch index.json', e);
    return; // abort — nothing else can proceed without the index
  }

  // Store the index array in STATE so buildNav() and others can use it
  STATE.countryIndex = indexData.countries;
  fill.style.width = '10%';

  // ── Phase 2: fetch all country files in parallel ───────
  txt.textContent = 'Loading destinations…';

  // Strip JS-style comments and parse JSON — country files contain // comment lines
  async function fetchJSON(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error(`${url} returned ${r.status}`);
    const text = await r.text();
    // Remove single-line comments (// ...) that make the files invalid JSON
    const clean = text.replace(/\/\/[^\n]*/g, '');
    return JSON.parse(clean);
  }

  const results = await Promise.allSettled(
    STATE.countryIndex.map(entry => fetchJSON(entry.file))
  );

  // Store results — fulfilled entries get real data, rejected entries get a stub
  results.forEach((result, i) => {
    const entry = STATE.countryIndex[i];
    if (result.status === 'fulfilled') {
      const data = result.value;
      // Support both {activities:[]} and flat array formats
      if (Array.isArray(data)) {
        STATE.countries[entry.slug] = { country: entry.name, activities: data };
      } else if (data.activities && Array.isArray(data.activities)) {
        STATE.countries[entry.slug] = data;
      } else {
        // Try to find an array anywhere in the object
        const firstArray = Object.values(data).find(v => Array.isArray(v));
        STATE.countries[entry.slug] = { country: entry.name, activities: firstArray || [] };
        if (!firstArray) console.warn(`loadCountries: ${entry.file} has no activities array. Keys:`, Object.keys(data));
      }
      console.log(`✓ ${entry.name}: ${STATE.countries[entry.slug].activities.length} activities`);
    } else {
      console.warn(`loadCountries: failed to load ${entry.file}`, result.reason);
      STATE.countries[entry.slug] = { country: entry.name, activities: [] };
    }
  });

  fill.style.width = '100%';
  STATE.currentCountry = STATE.countryIndex[0].slug;
  txt.textContent = 'Ready';

  setTimeout(() => {
    document.getElementById('loading').classList.add('done');
    initApp();
  }, 400);
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
function initApp() {
  buildNav();
  renderPool();
  renderActivityView();
  renderItinerary();
  bindEvents();
  // Init day state
  for (let i = 1; i <= STATE.dayCount; i++) {
    if (!STATE.itinerary[i]) STATE.itinerary[i] = [];
  }
}

// ═══════════════════════════════════════════════════════
// NAV
// ═══════════════════════════════════════════════════════
function buildNav() {
  const nav = document.getElementById('nav-bar');
  nav.innerHTML = '';

  if (!STATE.countryIndex || !STATE.countryIndex.length) return;

  // Planner tab
  const plannerBtn = document.createElement('button');
  plannerBtn.className = 'nav-tab' + (STATE.currentCountry === '__planner' ? ' active' : '');
  plannerBtn.textContent = '📋 Planner';
  plannerBtn.dataset.country = '__planner';
  plannerBtn.addEventListener('click', () => switchTab('__planner'));
  nav.appendChild(plannerBtn);

  for (const entry of STATE.countryIndex) {
    const d = STATE.countries[entry.slug];
    const btn = document.createElement('button');
    btn.className = 'nav-tab' + (STATE.currentCountry === entry.slug ? ' active' : '');
    const count = document.createElement('span');
    count.className = 'tab-count';
    count.textContent = d ? d.activities.length : 0;
    btn.innerHTML = `${entry.flag} ${entry.name} `;
    btn.appendChild(count);
    btn.dataset.country = entry.slug;
    btn.addEventListener('click', () => switchTab(entry.slug));
    nav.appendChild(btn);
  }
}

function switchTab(key) {
  STATE.currentCountry = key;
  STATE.filterCategory = '';
  STATE.filterPrice = '';
  STATE.filterRegion = '';
  STATE.searchQuery = '';
  document.getElementById('search-input').value = '';
  document.getElementById('filter-category').value = '';
  document.getElementById('filter-price').value = '';

  buildNav();

  if (key === '__planner') {
    switchView('itinerary');
  } else {
    switchView('activities');
    renderActivityView();
  }
}

// ═══════════════════════════════════════════════════════
// VIEW SWITCHER
// ═══════════════════════════════════════════════════════
function switchView(view) {
  STATE.currentView = view;
  document.getElementById('activity-view').style.display  = view === 'activities' ? 'flex' : 'none';
  document.getElementById('itinerary-view').style.display = view === 'itinerary'  ? 'flex' : 'none';
  document.getElementById('export-view').style.display    = view === 'export'     ? 'block' : 'none';

  document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));

  if (view === 'itinerary') renderItinerary();
  if (view === 'export') renderExport();
}

// ═══════════════════════════════════════════════════════
// ACTIVITY VIEW
// ═══════════════════════════════════════════════════════
function renderActivityView() {
  if (STATE.currentCountry === '__planner') return;
  const data = STATE.countries[STATE.currentCountry];
  if (!data) return;

  document.getElementById('country-label').textContent = data.country || '';

  // Region pills
  buildRegionPills(data);

  // Filter & render cards
  renderCards(data);
}

function buildRegionPills(data) {
  const bar = document.getElementById('region-pills');
  const regions = [...new Set(data.activities.map(a => a.region).filter(Boolean))];
  bar.innerHTML = '';
  if (!regions.length) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';

  const all = document.createElement('button');
  all.className = 'region-pill' + (!STATE.filterRegion ? ' active' : '');
  all.textContent = 'All Regions';
  all.addEventListener('click', () => { STATE.filterRegion = ''; buildRegionPills(data); renderCards(data); });
  bar.appendChild(all);

  for (const r of regions) {
    const btn = document.createElement('button');
    btn.className = 'region-pill' + (STATE.filterRegion === r ? ' active' : '');
    btn.textContent = r;
    btn.addEventListener('click', () => { STATE.filterRegion = r; buildRegionPills(data); renderCards(data); });
    bar.appendChild(btn);
  }
}

function renderCards(data) {
  const grid = document.getElementById('activity-grid');
  let acts = data.activities;

  // Filters
  if (STATE.filterRegion) acts = acts.filter(a => a.region === STATE.filterRegion);
  if (STATE.filterCategory) acts = acts.filter(a => a.category === STATE.filterCategory || (STATE.filterCategory === 'Food & Dining' && a.category === 'Food & Dining'));
  if (STATE.searchQuery) {
    const q = STATE.searchQuery.toLowerCase();
    acts = acts.filter(a => a.name.toLowerCase().includes(q) || (a.description||'').toLowerCase().includes(q) || (a.destination||'').toLowerCase().includes(q));
  }
  if (STATE.filterPrice) {
    if (STATE.filterPrice === 'free') acts = acts.filter(a => a.price_usd === 0);
    else if (STATE.filterPrice === '200+') acts = acts.filter(a => a.price_usd >= 200);
    else {
      const [lo,hi] = STATE.filterPrice.split('-').map(Number);
      acts = acts.filter(a => a.price_usd >= lo && a.price_usd < hi);
    }
  }

  document.getElementById('filter-count').textContent = `${acts.length} activities`;

  if (!acts.length) {
    grid.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>No activities match your filters.<br>Try adjusting your search.</p></div>';
    return;
  }

  const inPool = new Set(STATE.pool.map(p => p.id));
  grid.innerHTML = '';
  for (const act of acts) {
    grid.appendChild(buildActivityCard(act, inPool.has(act.id)));
  }
}

function buildActivityCard(act, added) {
  const card = document.createElement('div');
  card.className = 'activity-card' + (act.multi_day ? ' multi-day' : '') + (added ? ' added' : '');

  const catKey = (act.category||'').replace('Food & Dining','Food').replace('Water Sports','Water').replace('& ','').replace(' ','');
  const priceStr = act.price_usd === 0 ? 'Free' : `$${act.price_usd}`;
  const priceRange = (act.price_usd_min !== undefined && act.price_usd_min !== act.price_usd_max)
    ? `$${act.price_usd_min}–$${act.price_usd_max}` : priceStr;
  const dur = act.duration >= 24
    ? `${Math.round(act.duration/24)}d` : `${act.duration}h`;

  card.innerHTML = `
    <div class="card-header">
      <span class="card-category cat-${catKey}">${act.category||'General'}</span>
      <div class="card-name">${act.name}</div>
      <div class="card-location">📍 ${act.destination || act.location || ''}</div>
    </div>
    <div class="card-desc">${act.description||''}</div>
    <div class="card-footer">
      <div class="card-meta">
        <span class="price">💰 ${priceRange}</span>
        <span>⏱ ${dur}</span>
        ${act.multi_day ? '<span style="color:var(--gold-dim)">★ Multi-day</span>' : ''}
      </div>
      <button class="card-add-btn${added?' added':''}" data-id="${act.id}">${added?'✓ Added':'Add to Trip'}</button>
    </div>
  `;

  card.querySelector('.card-add-btn').addEventListener('click', function(e) {
    e.stopPropagation();
    if (STATE.pool.find(p => p.id === act.id)) { removeFromPool(act.id); }
    else { addToPool(act); }
  });

  return card;
}

// ═══════════════════════════════════════════════════════
// POOL
// ═══════════════════════════════════════════════════════
function addToPool(act) {
  if (STATE.pool.find(p => p.id === act.id)) return;
  STATE.pool.push({ ...act });
  renderPool();
  refreshCardsAddedState();
  toast(`${act.name} added to trip pool`, 'success');
}

function removeFromPool(id) {
  STATE.pool = STATE.pool.filter(p => p.id !== id);
  renderPool();
  refreshCardsAddedState();
  // Also remove from itinerary
  for (const day of Object.keys(STATE.itinerary)) {
    STATE.itinerary[day] = STATE.itinerary[day].filter(i => i.id !== id);
  }
  if (STATE.currentView === 'itinerary') renderItinerary();
}

function refreshCardsAddedState() {
  const inPool = new Set(STATE.pool.map(p => p.id));
  document.querySelectorAll('.activity-card').forEach(card => {
    const btn = card.querySelector('.card-add-btn');
    if (!btn) return;
    const id = btn.dataset.id;
    const added = inPool.has(id);
    card.classList.toggle('added', added);
    btn.classList.toggle('added', added);
    btn.textContent = added ? '✓ Added' : 'Add to Trip';
  });
}

function renderPool() {
  const body = document.getElementById('pool-body');
  const empty = document.getElementById('pool-empty');
  const meta = document.getElementById('pool-meta');
  const total = STATE.pool.reduce((s, p) => s + (p.price_usd||0), 0);
  const perPerson = STATE.headcount > 0 ? Math.round(total / STATE.headcount) : 0;

  meta.textContent = `${STATE.pool.length} activit${STATE.pool.length===1?'y':'ies'} selected`;
  document.getElementById('pool-total').textContent = '$' + total.toLocaleString();
  document.getElementById('pool-per-person').textContent = '$' + perPerson.toLocaleString();

  if (!STATE.pool.length) {
    empty.style.display = 'block';
    body.querySelectorAll('.pool-card').forEach(c => c.remove());
    return;
  }
  empty.style.display = 'none';

  // Re-render all cards
  body.querySelectorAll('.pool-card').forEach(c => c.remove());
  for (const item of STATE.pool) {
    body.appendChild(buildPoolCard(item));
  }
}

function buildPoolCard(item) {
  const card = document.createElement('div');
  card.className = 'pool-card';
  card.draggable = true;
  card.dataset.id = item.id;
  const dur = item.duration >= 24 ? `${Math.round(item.duration/24)}d` : `${item.duration}h`;
  card.innerHTML = `
    <div class="pool-card-name">${item.name}</div>
    <div class="pool-card-meta">
      <span class="pool-card-badge">${item.country||''}</span>
      <span class="pool-card-badge price">$${item.price_usd||0}</span>
      <span class="pool-card-badge">${dur}</span>
    </div>
    <button class="pool-card-remove" data-id="${item.id}">✕</button>
  `;

  card.querySelector('.pool-card-remove').addEventListener('click', () => removeFromPool(item.id));

  // Drag from pool to itinerary
  card.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/plain', JSON.stringify({source:'pool', id: item.id}));
    card.classList.add('dragging');
  });
  card.addEventListener('dragend', () => card.classList.remove('dragging'));

  return card;
}

// ═══════════════════════════════════════════════════════
// ITINERARY
// ═══════════════════════════════════════════════════════
function renderItinerary() {
  const canvas = document.getElementById('itinerary-canvas');
  canvas.innerHTML = '';

  // Ensure all days exist
  for (let i = 1; i <= STATE.dayCount; i++) {
    if (!STATE.itinerary[i]) STATE.itinerary[i] = [];
  }

  for (let day = 1; day <= STATE.dayCount; day++) {
    canvas.appendChild(buildDayColumn(day));
  }
}

function buildDayColumn(day) {
  const col = document.createElement('div');
  col.className = 'day-column';
  col.dataset.day = day;

  const itemCount = STATE.itinerary[day]?.length || 0;
  col.innerHTML = `
    <div class="day-header">
      <span>Day ${day}</span>
      <span style="font-size:.68rem">${itemCount} item${itemCount===1?'':'s'}</span>
    </div>
    <div class="day-body" id="day-body-${day}" data-day="${day}"></div>
  `;

  const body = col.querySelector('.day-body');
  // Drop zone
  body.addEventListener('dragover', e => { e.preventDefault(); body.classList.add('drag-over'); });
  body.addEventListener('dragleave', () => body.classList.remove('drag-over'));
  body.addEventListener('drop', e => {
    e.preventDefault();
    body.classList.remove('drag-over');
    handleDrop(e, day, null);
  });

  if (STATE.hourMode) {
    renderHourSlots(body, day);
  } else {
    renderDayItems(body, day);
  }

  return col;
}

function renderDayItems(body, day) {
  const items = STATE.itinerary[day] || [];
  if (!items.length) {
    const zone = document.createElement('div');
    zone.className = 'day-drop-zone';
    zone.textContent = 'Drop activities here';
    body.appendChild(zone);
  }
  for (const item of items) {
    body.appendChild(buildItineraryItem(item, day));
  }
}

function renderHourSlots(body, day) {
  const slotDiv = document.createElement('div');
  slotDiv.className = 'hour-slots';
  const hours = Array.from({length:24},(_,i)=>(i+6)%24);
  for (const h of hours) {
    const slot = document.createElement('div');
    slot.className = 'hour-slot';
    const label = document.createElement('div');
    label.className = 'hour-label';
    label.textContent = h === 0 ? '12a' : h < 12 ? `${h}a` : h === 12 ? '12p' : `${h-12}p`;
    const slotBody = document.createElement('div');
    slotBody.className = 'hour-slot-body';
    slotBody.dataset.day = day;
    slotBody.dataset.hour = h;
    slotBody.addEventListener('dragover', e => { e.preventDefault(); slotBody.classList.add('drag-over'); });
    slotBody.addEventListener('dragleave', () => slotBody.classList.remove('drag-over'));
    slotBody.addEventListener('drop', e => {
      e.preventDefault();
      slotBody.classList.remove('drag-over');
      handleDrop(e, day, h);
    });
    // Render items assigned to this hour
    const items = (STATE.itinerary[day]||[]).filter(i => i.hour === h);
    items.forEach(item => slotBody.appendChild(buildItineraryItem(item, day)));
    slot.appendChild(label);
    slot.appendChild(slotBody);
    slotDiv.appendChild(slot);
  }
  body.appendChild(slotDiv);
  // Items with no hour at top
  const unscheduled = (STATE.itinerary[day]||[]).filter(i => i.hour === undefined || i.hour === null);
  if (unscheduled.length) {
    const zone = document.createElement('div');
    zone.style.cssText = 'padding:4px 0;border-bottom:1px solid var(--border);margin-bottom:4px';
    zone.innerHTML = '<div style="font-size:.65rem;color:var(--text-muted);padding:0 4px 4px">Unscheduled</div>';
    unscheduled.forEach(item => zone.appendChild(buildItineraryItem(item, day)));
    body.insertBefore(zone, body.firstChild);
  }
}

function buildItineraryItem(item, day) {
  const el = document.createElement('div');
  el.className = 'itinerary-item' + (item.custom ? ' custom-item' : '');
  el.draggable = true;
  el.dataset.id = item.id;
  el.dataset.day = day;
  const dur = item.duration >= 24 ? `${Math.round(item.duration/24)}d` : `${item.duration}h`;
  el.innerHTML = `
    <div class="itinerary-item-name">${item.name}</div>
    <div class="itinerary-item-meta">
      <span>$${item.price_usd||0}</span>
      <span>•</span>
      <span>${dur}</span>
      ${item.hour !== undefined && item.hour !== null ? `<span>• ${formatHour(item.hour)}</span>` : ''}
    </div>
    <button class="itinerary-item-remove" data-id="${item.id}" data-day="${day}">✕</button>
  `;
  el.querySelector('.itinerary-item-remove').addEventListener('click', e => {
    e.stopPropagation();
    removeFromItinerary(item.id, day);
  });
  el.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/plain', JSON.stringify({source:'itinerary', id: item.id, fromDay: day}));
    el.classList.add('dragging');
  });
  el.addEventListener('dragend', () => el.classList.remove('dragging'));
  return el;
}

function formatHour(h) {
  if (h === 0) return '12:00 AM';
  if (h < 12) return `${h}:00 AM`;
  if (h === 12) return '12:00 PM';
  return `${h-12}:00 PM`;
}

function handleDrop(e, toDay, hour) {
  let data;
  try { data = JSON.parse(e.dataTransfer.getData('text/plain')); } catch { return; }

  if (data.source === 'pool') {
    const item = STATE.pool.find(p => p.id === data.id);
    if (!item) return;
    const already = (STATE.itinerary[toDay]||[]).find(i => i.id === data.id);
    if (already) { toast('Already on this day'); return; }
    if (!STATE.itinerary[toDay]) STATE.itinerary[toDay] = [];
    STATE.itinerary[toDay].push({...item, hour: hour ?? undefined});
    toast(`${item.name} → Day ${toDay}`, 'success');
  } else if (data.source === 'itinerary') {
    const fromDay = data.fromDay;
    const idx = (STATE.itinerary[fromDay]||[]).findIndex(i => i.id === data.id);
    if (idx === -1) return;
    const [item] = STATE.itinerary[fromDay].splice(idx, 1);
    if (toDay === fromDay && hour !== undefined && hour !== null) {
      item.hour = hour;
      STATE.itinerary[toDay].push(item);
    } else if (toDay !== fromDay) {
      item.hour = hour ?? undefined;
      if (!STATE.itinerary[toDay]) STATE.itinerary[toDay] = [];
      STATE.itinerary[toDay].push(item);
    }
  }
  renderItinerary();
}

function removeFromItinerary(id, day) {
  STATE.itinerary[day] = (STATE.itinerary[day]||[]).filter(i => i.id !== id);
  renderItinerary();
}

// ═══════════════════════════════════════════════════════
// EXPORT / SUMMARY
// ═══════════════════════════════════════════════════════
function renderExport() {
  const container = document.getElementById('export-content');
  const totalCost = STATE.pool.reduce((s,p) => s+(p.price_usd||0), 0);
  const perPerson = STATE.headcount > 0 ? Math.round(totalCost/STATE.headcount) : 0;

  let html = `<div class="export-section">
    <h3>Trip Overview</h3>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:8px">
      <div style="background:var(--surface3);border-radius:6px;padding:14px;text-align:center">
        <div style="font-size:1.6rem;color:var(--gold);font-family:var(--font-display)">${STATE.pool.length}</div>
        <div style="font-size:.72rem;color:var(--text-dim);margin-top:2px">Activities Selected</div>
      </div>
      <div style="background:var(--surface3);border-radius:6px;padding:14px;text-align:center">
        <div style="font-size:1.6rem;color:var(--gold);font-family:var(--font-display)">${STATE.dayCount}</div>
        <div style="font-size:.72rem;color:var(--text-dim);margin-top:2px">Days Planned</div>
      </div>
      <div style="background:var(--surface3);border-radius:6px;padding:14px;text-align:center">
        <div style="font-size:1.6rem;color:var(--gold);font-family:var(--font-display)">$${totalCost.toLocaleString()}</div>
        <div style="font-size:.72rem;color:var(--text-dim);margin-top:2px">Total Estimated Cost</div>
      </div>
      <div style="background:var(--surface3);border-radius:6px;padding:14px;text-align:center">
        <div style="font-size:1.6rem;color:var(--gold);font-family:var(--font-display)">$${perPerson.toLocaleString()}</div>
        <div style="font-size:.72rem;color:var(--text-dim);margin-top:2px">Per Person (${STATE.headcount})</div>
      </div>
    </div>
  </div>`;

  // Itinerary days
  let hasItinerary = false;
  let itinHtml = '';
  for (let d = 1; d <= STATE.dayCount; d++) {
    const items = STATE.itinerary[d] || [];
    if (!items.length) continue;
    hasItinerary = true;
    itinHtml += `<div class="export-day"><h4>Day ${d}</h4>`;
    for (const item of items) {
      const dur = item.duration >= 24 ? `${Math.round(item.duration/24)} days` : `${item.duration} hrs`;
      const timeStr = item.hour !== undefined ? ` — ${formatHour(item.hour)}` : '';
      itinHtml += `<div class="export-item"><span>${item.name}${timeStr}</span><span style="color:var(--text-dim)">$${item.price_usd||0} · ${dur}</span></div>`;
    }
    itinHtml += '</div>';
  }
  if (hasItinerary) {
    html += `<div class="export-section"><h3>Itinerary Schedule</h3>${itinHtml}</div>`;
  }

  // Pool list
  if (STATE.pool.length) {
    html += `<div class="export-section"><h3>All Selected Activities</h3>`;
    for (const item of STATE.pool) {
      const dur = item.duration >= 24 ? `${Math.round(item.duration/24)} days` : `${item.duration} hrs`;
      html += `<div class="export-item"><span>${item.name} <span style="color:var(--text-muted);font-size:.7rem">— ${item.country||''}</span></span><span style="color:var(--text-dim)">$${item.price_usd||0} · ${dur}</span></div>`;
    }
    html += `<div class="export-total"><span>Total Estimated Cost</span><span style="color:var(--gold)">$${totalCost.toLocaleString()} ($${perPerson.toLocaleString()} / person)</span></div>`;
    html += '</div>';
  }

  html += `<div style="display:flex;gap:10px;justify-content:flex-end;padding:8px 0">
    <button class="btn btn-outline" onclick="window.print()">🖨️ Print / Save PDF</button>
    <button class="btn btn-outline" onclick="exportJSON()">📥 Export JSON</button>
  </div>`;

  container.innerHTML = html;
}

function exportJSON() {
  const data = {
    trip_name: 'Bachelor Party Trip',
    generated: new Date().toISOString(),
    headcount: STATE.headcount,
    total_cost_usd: STATE.pool.reduce((s,p) => s+(p.price_usd||0), 0),
    pool: STATE.pool,
    itinerary: STATE.itinerary,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'bachelor-trip.json'; a.click();
  URL.revokeObjectURL(url);
}

// ═══════════════════════════════════════════════════════
// SAVE / LOAD
// ═══════════════════════════════════════════════════════
function saveTrip(name) {
  const key = 'bp_trip_' + (name || 'default').replace(/\s+/g,'_');
  const data = {
    name, saved: new Date().toISOString(),
    pool: STATE.pool, itinerary: STATE.itinerary,
    dayCount: STATE.dayCount, headcount: STATE.headcount
  };
  localStorage.setItem(key, JSON.stringify(data));
  localStorage.setItem('bp_last_trip', key);
  toast(`Trip "${name}" saved`, 'success');
}

function loadLastTrip() {
  const key = localStorage.getItem('bp_last_trip');
  if (!key) return;
  const raw = localStorage.getItem(key);
  if (!raw) return;
  try {
    const data = JSON.parse(raw);
    STATE.pool = data.pool || [];
    STATE.itinerary = data.itinerary || {};
    STATE.dayCount = data.dayCount || 5;
    STATE.headcount = data.headcount || 10;
    document.getElementById('day-count').value = STATE.dayCount;
    document.getElementById('headcount').value = STATE.headcount;
    renderPool();
    renderItinerary();
    toast(`Trip "${data.name}" loaded`, 'success');
  } catch(e) { toast('Could not load trip'); }
}

// ═══════════════════════════════════════════════════════
// CUSTOM EVENT
// ═══════════════════════════════════════════════════════
function openCustomModal() {
  document.getElementById('modal-custom').classList.add('open');
  document.getElementById('custom-name').focus();
}
function closeCustomModal() {
  document.getElementById('modal-custom').classList.remove('open');
}
function saveCustomEvent() {
  const name = document.getElementById('custom-name').value.trim();
  if (!name) { toast('Please enter an event name'); return; }
  const item = {
    id: 'custom_' + Date.now(),
    name,
    location: document.getElementById('custom-location').value.trim(),
    country: 'Custom',
    category: document.getElementById('custom-category').value,
    price_usd: parseFloat(document.getElementById('custom-price').value) || 0,
    price_usd_min: parseFloat(document.getElementById('custom-price').value) || 0,
    price_usd_max: parseFloat(document.getElementById('custom-price').value) || 0,
    duration: parseFloat(document.getElementById('custom-duration').value) || 2,
    description: document.getElementById('custom-notes').value.trim(),
    custom: true,
    multi_day: false,
  };
  addToPool(item);
  closeCustomModal();
  ['custom-name','custom-location','custom-price','custom-duration','custom-notes'].forEach(id => {
    document.getElementById(id).value = '';
  });
}

// ═══════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════
let toastTimer;
function toast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (type ? ' '+type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

// ═══════════════════════════════════════════════════════
// EVENTS
// ═══════════════════════════════════════════════════════
function bindEvents() {
  // Theme toggle
  (function initTheme() {
    const saved = localStorage.getItem('bp_theme') || 'dark';
    if (saved === 'light') {
      document.documentElement.setAttribute('data-theme','light');
      document.getElementById('btn-theme').textContent = '☀️';
    }
  })();
  document.getElementById('btn-theme').addEventListener('click', () => {
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    if (isLight) {
      document.documentElement.removeAttribute('data-theme');
      document.getElementById('btn-theme').textContent = '🌙';
      localStorage.setItem('bp_theme','dark');
    } else {
      document.documentElement.setAttribute('data-theme','light');
      document.getElementById('btn-theme').textContent = '☀️';
      localStorage.setItem('bp_theme','light');
    }
  });

  // View buttons
  document.querySelectorAll('.view-btn').forEach(btn => {
    btn.addEventListener('click', () => switchView(btn.dataset.view));
  });

  // Filters
  document.getElementById('search-input').addEventListener('input', e => {
    STATE.searchQuery = e.target.value;
    if (STATE.currentCountry !== '__planner') renderCards(STATE.countries[STATE.currentCountry]);
  });
  document.getElementById('filter-category').addEventListener('change', e => {
    STATE.filterCategory = e.target.value;
    if (STATE.currentCountry !== '__planner') renderCards(STATE.countries[STATE.currentCountry]);
  });
  document.getElementById('filter-price').addEventListener('change', e => {
    STATE.filterPrice = e.target.value;
    if (STATE.currentCountry !== '__planner') renderCards(STATE.countries[STATE.currentCountry]);
  });

  // Pool collapse
  document.getElementById('pool-collapse-btn').addEventListener('click', () => {
    STATE.poolCollapsed = !STATE.poolCollapsed;
    document.getElementById('trip-pool').classList.toggle('collapsed', STATE.poolCollapsed);
    document.getElementById('pool-collapse-btn').textContent = STATE.poolCollapsed ? '›' : '‹';
    document.getElementById('pool-reopen-tab').classList.toggle('visible', STATE.poolCollapsed);
  });

  // Pool reopen tab
  document.getElementById('pool-reopen-tab').addEventListener('click', () => {
    STATE.poolCollapsed = false;
    document.getElementById('trip-pool').classList.remove('collapsed');
    document.getElementById('pool-collapse-btn').textContent = '‹';
    document.getElementById('pool-reopen-tab').classList.remove('visible');
  });

  // Headcount
  document.getElementById('headcount').addEventListener('input', e => {
    STATE.headcount = parseInt(e.target.value) || 1;
    renderPool();
  });

  // Pool clear
  document.getElementById('pool-clear-btn').addEventListener('click', () => {
    if (!STATE.pool.length) return;
    STATE.pool = [];
    for (const d of Object.keys(STATE.itinerary)) STATE.itinerary[d] = [];
    renderPool();
    refreshCardsAddedState();
    if (STATE.currentView === 'itinerary') renderItinerary();
    toast('Trip pool cleared');
  });

  // Day controls
  document.getElementById('day-minus').addEventListener('click', () => {
    if (STATE.dayCount <= 1) return;
    STATE.dayCount--;
    document.getElementById('day-count').value = STATE.dayCount;
    renderItinerary();
  });
  document.getElementById('day-plus').addEventListener('click', () => {
    if (STATE.dayCount >= 14) return;
    STATE.dayCount++;
    if (!STATE.itinerary[STATE.dayCount]) STATE.itinerary[STATE.dayCount] = [];
    document.getElementById('day-count').value = STATE.dayCount;
    renderItinerary();
  });
  document.getElementById('day-count').addEventListener('change', e => {
    const v = Math.min(14, Math.max(1, parseInt(e.target.value)||1));
    STATE.dayCount = v;
    for (let i = 1; i <= v; i++) { if (!STATE.itinerary[i]) STATE.itinerary[i] = []; }
    renderItinerary();
  });

  // Hour mode
  document.getElementById('hour-mode-toggle').addEventListener('change', e => {
    STATE.hourMode = e.target.checked;
    renderItinerary();
  });

  // Clear itinerary
  document.getElementById('btn-clear-itinerary').addEventListener('click', () => {
    for (const d of Object.keys(STATE.itinerary)) STATE.itinerary[d] = [];
    renderItinerary();
    toast('Itinerary cleared');
  });

  // Save
  document.getElementById('btn-save').addEventListener('click', () => {
    document.getElementById('save-name').value = '';
    document.getElementById('modal-save').classList.add('open');
    document.getElementById('save-name').focus();
  });
  document.getElementById('save-cancel').addEventListener('click', () => {
    document.getElementById('modal-save').classList.remove('open');
  });
  document.getElementById('save-confirm').addEventListener('click', () => {
    const name = document.getElementById('save-name').value.trim() || 'My Trip';
    saveTrip(name);
    document.getElementById('modal-save').classList.remove('open');
  });

  // Load
  document.getElementById('btn-load').addEventListener('click', loadLastTrip);

  // Export
  document.getElementById('btn-export').addEventListener('click', () => switchView('export'));

  // Custom event
  document.getElementById('btn-custom-event').addEventListener('click', openCustomModal);
  document.getElementById('custom-cancel').addEventListener('click', closeCustomModal);
  document.getElementById('custom-save').addEventListener('click', saveCustomEvent);

  // Mobile pool toggle
  const mobileToggle = document.getElementById('pool-toggle-mobile');
  if (mobileToggle) {
    mobileToggle.addEventListener('click', () => {
      STATE.poolCollapsed = !STATE.poolCollapsed;
      document.getElementById('trip-pool').classList.toggle('collapsed', STATE.poolCollapsed);
    });
  }

  // Modal close on overlay click
  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', e => {
      if (e.target === overlay) overlay.classList.remove('open');
    });
  });

  // Keyboard
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      document.querySelectorAll('.modal-overlay.open').forEach(m => m.classList.remove('open'));
    }
  });

  // Mobile: show pool toggle on small screens
  function checkMobile() {
    const isMobile = window.innerWidth <= 900;
    if (mobileToggle) mobileToggle.style.display = isMobile ? 'flex' : 'none';
  }
  window.addEventListener('resize', checkMobile);
  checkMobile();
}

// ═══════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════
function updateLayoutHeight() {
  const header = document.getElementById('app-header');
  const nav = document.getElementById('nav-bar');
  const layout = document.getElementById('main-layout');
  const used = header.offsetHeight + nav.offsetHeight;
  layout.style.height = `calc(100vh - ${used}px)`;
}

window.addEventListener('resize', updateLayoutHeight);

loadCountries();
// Also recalc after nav tabs are built
const _origInitApp = initApp;
initApp = function() { _origInitApp(); updateLayoutHeight(); };
</script>
