<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trip Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- LOADING -->
<div id="loading">
  <div class="loading-logo">TRIP BUILDER</div>
  <div class="loading-bar"><div class="loading-fill" id="loading-fill"></div></div>
  <div class="loading-text" id="loading-text">Loading destinations…</div>
</div>

<!-- HEADER -->
<header id="app-header">
  <div class="header-logo">
    Trip Builder
  </div>
  <div class="header-actions">
    <button id="btn-theme" title="Toggle light/dark mode">🌙</button>
    <button class="btn btn-outline btn-sm" id="btn-save">💾 Save</button>
    <button class="btn btn-outline btn-sm" id="btn-load">📂 Load</button>
    <button class="btn btn-outline btn-sm" id="btn-export">📋 Export</button>
    <button class="btn btn-gold btn-sm" id="btn-custom-event">+ Custom Event</button>
    <button class="btn btn-ghost btn-sm" id="pool-toggle-mobile" style="display:none">🗂 Pool</button>
  </div>
</header>

<!-- COUNTRY NAV -->
<nav id="nav-bar"></nav>
<!-- MOBILE NAV (continent dropdowns, mobile only) -->
<nav id="mobile-nav"></nav>

<!-- MAIN -->
<div id="main-layout">

  <!-- TRIP POOL REOPEN TAB -->
  <button id="pool-reopen-tab" title="Open Trip Pool">Pool</button>

  <!-- TRIP POOL -->
  <aside id="trip-pool">
    <div class="pool-header">
      <div>
        <div class="pool-title">Trip Pool</div>
        <div class="pool-meta" id="pool-meta">0 activities selected</div>
      </div>
      <button class="btn-icon" id="pool-collapse-btn" title="Collapse">‹</button>
    </div>
    <div class="pool-body" id="pool-body">
      <div class="pool-empty" id="pool-empty">
        <span class="icon">🗺️</span>
        Browse activities and tap<br><strong style="color:var(--text-dim)">Add to Trip</strong><br>to start planning
      </div>
    </div>
    <div class="pool-footer">
      <div class="pool-cost">
        <span class="label">Total Cost</span>
        <span class="value" id="pool-total">$0</span>
      </div>
      <div class="pool-cost">
        <span class="label">Per Person</span>
        <span class="value" id="pool-per-person">$0</span>
      </div>
      <div class="headcount-row">
        <label for="headcount">Guests:</label>
        <input type="number" id="headcount" value="10" min="1" max="100">
        <button class="btn btn-ghost btn-sm" id="pool-clear-btn" style="margin-left:auto;color:var(--text-muted);font-size:.7rem">Clear all</button>
      </div>
    </div>
  </aside>

  <!-- CENTER -->
  <div id="center-panel">
    <!-- VIEW SWITCHER -->
    <div id="view-tabs">
      <div class="view-switcher">
        <button class="view-btn active" data-view="activities">Browse</button>
        <button class="view-btn" data-view="itinerary">Itinerary</button>
        <button class="view-btn" data-view="export">Summary</button>
      </div>
      <div class="view-actions">
        <span id="country-label" style="font-size:.75rem;color:var(--text-dim)"></span>
      </div>
    </div>

    <!-- ACTIVITIES VIEW -->
    <div id="activity-view">
      <div class="filter-bar">
        <input type="text" id="search-input" placeholder="Search activities…" style="max-width:220px">
        <select id="filter-category">
          <option value="">All Categories</option>
          <option>Adventure</option><option>Cultural</option><option>Food & Dining</option>
          <option>Nature</option><option>Nightlife</option><option>Sightseeing</option>
          <option>Shopping</option><option>Water Sports</option><option>Wellness</option>
        </select>
        <select id="filter-price">
          <option value="">Any Price</option>
          <option value="0-25">Under $25</option>
          <option value="25-75">$25–$75</option>
          <option value="75-200">$75–$200</option>
          <option value="200+">$200+</option>
          <option value="free">Free</option>
        </select>
        <span class="filter-count" id="filter-count"></span>
      </div>
      <div class="region-filter-bar" id="region-pills"></div>
      <div class="region-filter-bar" id="subregion-pills" style="display:none;background:var(--surface3);border-bottom:1px solid var(--border)"></div>
      <!-- MOBILE REGION SELECTS (mobile only) -->
      <div id="mobile-region-selects" style="display:none"></div>
      <div class="activity-grid" id="activity-grid"></div>
    </div>

    <!-- ITINERARY VIEW -->
    <div id="itinerary-view" style="display:none">
      <div class="itinerary-toolbar">
        <div class="day-controls">
          <label>Days:</label>
          <button class="btn-icon btn-sm" id="day-minus">−</button>
          <input type="number" id="day-count" value="5" min="1" max="14" style="width:48px;text-align:center">
          <button class="btn-icon btn-sm" id="day-plus">+</button>
        </div>
        <div class="hour-toggle">
          <label for="hour-mode-toggle">Hour detail</label>
          <label class="toggle-switch">
            <input type="checkbox" id="hour-mode-toggle">
            <span class="toggle-slider"></span>
          </label>
        </div>
        <button class="btn btn-outline btn-sm" id="btn-clear-itinerary" style="margin-left:auto">Clear Itinerary</button>
      </div>
      <div class="itinerary-canvas" id="itinerary-canvas"></div>
    </div>

    <!-- EXPORT VIEW -->
    <div id="export-view">
      <div id="export-content"></div>
    </div>
  </div>
</div>

<!-- CUSTOM EVENT MODAL -->
<div class="modal-overlay" id="modal-custom">
  <div class="modal">
    <h2>Custom Event</h2>
    <div class="form-group">
      <label>Event Name *</label>
      <input type="text" id="custom-name" placeholder="e.g. Private Yacht Charter">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Location</label>
        <input type="text" id="custom-location" placeholder="City, Country">
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="custom-category">
          <option>Adventure</option><option>Cultural</option><option>Food & Dining</option>
          <option>Nature</option><option selected>Nightlife</option><option>Sightseeing</option>
          <option>Shopping</option><option>Water Sports</option><option>Wellness</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Price (USD)</label>
        <input type="number" id="custom-price" placeholder="0" min="0">
      </div>
      <div class="form-group">
        <label>Duration (hours)</label>
        <input type="number" id="custom-duration" placeholder="2" min="0.5" step="0.5">
      </div>
    </div>
    <div class="form-group">
      <label>Notes</label>
      <textarea id="custom-notes" placeholder="Any details about this event…"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="custom-cancel">Cancel</button>
      <button class="btn btn-gold" id="custom-save">Add to Pool</button>
    </div>
  </div>
</div>

<!-- SAVE MODAL -->
<div class="modal-overlay" id="modal-save">
  <div class="modal">
    <h2>Save Trip</h2>
    <div class="form-group">
      <label>Trip Name</label>
      <input type="text" id="save-name" placeholder="e.g. Jake's Bachelor Party - Thailand 2026">
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="save-cancel">Cancel</button>
      <button class="btn btn-gold" id="save-confirm">Save</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
